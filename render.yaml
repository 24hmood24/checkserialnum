services:
  - type: web
    name: checkserialnum
    runtime: node
    plan: free
    # --include=dev: Render sets NODE_ENV=production for the build too,
    # which makes `npm ci` skip devDependencies by default — but vite
    # (and the rest of the build toolchain) live there. Without this
    # flag the build fails with "sh: 1: vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0
    # NOTE: no persistent disk here — Render's free plan doesn't support
    # them. Without one, server/data.sqlite lives on ephemeral storage and
    # is WIPED on every deploy and whenever the free instance spins down
    # from inactivity. See the "Persistent storage" section in README.md
    # before relying on this for real data — upgrade to a paid plan and
    # add a disk (see render.yaml git history), or move to a managed
    # database, once that matters.
