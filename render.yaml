services:
  - type: web
    name: checkserialnum
    runtime: node
    plan: free
    # --include=dev: Render sets NODE_ENV=production for the build too,
    # which makes `npm ci` skip devDependencies by default — but vite
    # (and the rest of the build toolchain) live there. Without this
    # flag the build fails with "sh: 1: vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Real, persistent storage lives in MongoDB Atlas, not on this
      # service's own (ephemeral, free-tier) disk — so no local disk is
      # needed here. sync: false means Render won't store a value in this
      # file; it prompts for it (kept as a secret) when the blueprint is
      # applied. Get this from Atlas: Cluster -> Connect -> Drivers.
      - key: MONGODB_URI
        sync: false
      # Signs session tokens (login, admin checks). generateValue: true
      # means Render creates a strong random value itself — nothing to
      # provide.
      - key: SESSION_SECRET
        generateValue: true
